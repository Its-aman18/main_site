# ZERO → ONE — Oracle VM nginx reverse-proxy block.
#
# Assumes certbot has issued https://zero-one.codescriet.dev and the
# zero-one backend (systemd: zero-one-backend.service) listens on
# 127.0.0.1:5003 serving BOTH the built frontend (dist/) and /api
# (same-origin — no CORS needed in production).
#
# Copy to /etc/nginx/sites-available/zero-one.codescriet.dev, symlink into
# sites-enabled, then `nginx -t && systemctl reload nginx`.
#
# Port map on the VM (all bound to 127.0.0.1 except via nginx):
#   main API          :5001  (api.codescriet.dev)
#   playground backend:5002
#   zero-one backend  :5003  (zero-one.codescriet.dev)  <-- this file
#   main web          :5173  (codescriet.dev, static or vite preview)
#   playground web    :5174  (code.codescriet.dev)
#   zero-one dev only :5175  (never exposed publicly)

upstream zero_one_backend {
  server 127.0.0.1:5003;
  keepalive 32;
}

server {
  listen 80;
  server_name zero-one.codescriet.dev;
  # Redirect to HTTPS (certbot usually manages this block itself).
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name zero-one.codescriet.dev;

  # Managed by certbot — keep these lines:
  # ssl_certificate     /etc/letsencrypt/live/zero-one.codescriet.dev/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/zero-one.codescriet.dev/privkey.pem;

  # Venue-LAN webscreens / projector clients may hold long SSE streams.
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;

  # SSE endpoint: no buffering, HTTP/1.1, dedicated timeouts.
  location = /api/realtime/stream {
    proxy_pass http://zero_one_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://zero_one_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 2m;
  }

  # Everything else is the built SPA (index.html + /admin.html dual entry).
  location / {
    proxy_pass http://zero_one_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
